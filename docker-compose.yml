# Networks
networks:
  frontend:
  backend:
  datastore:
  observability:

# Volumes
volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  loki_data:

# Default resource limits (override per service if needed)
x-default-resources: &default-resources
  limits:
    memory: 256m
    cpus: "0.5"
  reservations:
    memory: 64m

services:
  # C++ management core
  corvus-core:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - CORVUS_ENV=development
      - CORVUS_DB_HOST=postgres
      - CORVUS_REDIS_HOST=redis
      - CORVUS_REDIS_PORT=6379
      - CORVUS_JWT_PUBLIC_KEY=${CORVUS_JWT_PUBLIC_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - frontend
      - backend
    restart: on-failure
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.5"
        reservations:
          memory: 32m

  # PostgreSQL - alpine image, minimal config
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: corvus
      POSTGRES_USER: corvus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-corvus_dev}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    command: >
      postgres
      -c shared_buffers=32MB
      -c max_connections=20
      -c wal_level=minimal
      -c max_wal_senders=0
      -c synchronous_commit=off
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corvus -d corvus"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - datastore
    restart: on-failure
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.5"
        reservations:
          memory: 32m

  # Redis - alpine, AOF disabled for dev (faster, less disk)
  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --save ""
      --appendonly no
      --maxmemory 64mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - datastore
    restart: on-failure
    deploy:
      resources:
        limits:
          memory: 96m
          cpus: "0.25"
        reservations:
          memory: 32m

  # TimescaleDB - replaced with postgres + timescaledb extension
  timescaledb:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: corvus_ts
      POSTGRES_USER: corvus
      POSTGRES_PASSWORD: ${TIMESCALE_PASSWORD:-corvus_dev}
    command: >
      postgres
      -c shared_buffers=32MB
      -c max_connections=10
      -c synchronous_commit=off
    volumes:
      - ./deploy/docker/init-timescale.sh:/docker-entrypoint-initdb.d/init-timescale.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corvus -d corvus_ts"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - datastore
    restart: on-failure
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.5"
        reservations:
          memory: 32m

  # Prometheus - short retention, no remote write
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=3d"
      - "--storage.tsdb.retention.size=512MB"
      - "--web.enable-lifecycle"
      - "--log.level=warn"
    ports:
      - "9090:9090"
    networks:
      - observability
      - backend
    restart: on-failure
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
        reservations:
          memory: 64m

  # Grafana - OSS image, minimal plugins
  grafana:
    image: grafana/grafana-oss:latest
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES=false
      - GF_LOG_LEVEL=warn
      - GF_PLUGINS_ENABLE_ALPHA=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - observability
    restart: on-failure
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
        reservations:
          memory: 64m

  #  Loki - filesystem storage, minimal config
  loki:
    image: grafana/loki:latest
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/loki-config.yml
    ports:
      - "3100:3100"
    networks:
      - observability
    restart: on-failure
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.25"
        reservations:
          memory: 32m

  # Jaeger memory storage only, no persistence needed for dev
  jaeger:
    image: jaegertracing/jaeger:latest
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - SPAN_STORAGE_TYPE=memory
      - MEMORY_MAX_TRACES=1000
    ports:
      - "16686:16686" # Jaeger UI
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    networks:
      - observability
      - backend
    restart: on-failure
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.25"
        reservations:
          memory: 32m
