apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Loki
    type: loki
    url: http://loki:3100
    editable: false

  - name: Jaeger
    type: jaeger
    url: http://jaeger:16686
    editable: false

  - name: TimescaleDB
    type: postgres
    url: timescaledb:5432
    database: corvus_ts
    user: corvus
    secureJsonData:
      password: "${TIMESCALE_PASSWORD}"
    jsonData:
      sslmode: disable
    editable: false
